{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block heading %}Something went wrong{% endblock %}
{% block content %}
<div class="card-x text-center py-5">
  <div class="display-3 fw-bold text-secondary">{{ code }}</div>
  <p class="lead mb-4">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('page_dashboard') }}">Back to the dashboard</a>
</div>
{% endblock %}
